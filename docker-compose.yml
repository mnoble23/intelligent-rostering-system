version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: rostering-db
    environment:
      POSTGRES_USER: rostering
      POSTGRES_PASSWORD: rostering
      POSTGRES_DB: rostering
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostering -d rostering"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rostering-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://rostering:rostering@db:5432/rostering
      JWT_SECRET_KEY: change-me-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      DEFAULT_USER_PASSWORD: ChangeMe123!
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rostering-frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
